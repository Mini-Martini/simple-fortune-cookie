name: CI
on: 
  push:
    branches: main
  pull_request:
    branches: main
jobs:
  Build-and-test:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4       
      - name: Set up Go
        run: actions/setup-go@v5
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
